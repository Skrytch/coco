<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1D6FE0">
<meta name="description" content="Apprendre en jouant le vocabulaire anglais Cambridge Pre A1 Starters, à l'oral et à l'écrit.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='88'%3E%F0%9F%A6%9C%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Coco">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Coco Starters</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Grandstander:wght@600;800;900&display=swap">
<style>
/* Layout: one phone-first column (max 560px). Home = a winding lesson path grouped by the book's themes; lesson = full screen with a Duolingo-style answer sheet that slides up from the bottom. */
:root{
  --bg:#EDF2F9; --surface:#FFFFFF; --surface-2:#E2E9F3; --line:#CCD7E6; --line-2:#AFBED3;
  --fg:#15203A; --muted:#58678A;
  --accent:#1D6FE0; --accent-press:#1453AE; --accent-soft:#DCE8FB; --on-accent:#FFFFFF;
  --sun:#FFB81C; --sun-press:#D18F00; --sun-soft:#FFF0C7; --on-sun:#3B2700;
  --ok:#22A24C; --ok-press:#167A36; --ok-soft:#D8F3E0; --ok-ink:#0E6A2C;
  --ko:#E1383F; --ko-press:#A9222A; --ko-soft:#FCE0E1; --ko-ink:#9C1B21;
  --c1:#1D6FE0; --c2:#E8412C; --c3:#E39400; --c4:#0E9C8C; --c5:#8A4FD8; --c6:#D63F7D; --c7:#4E9A1A; --c8:#4F6185;
  --pip-red:#E8412C; --pip-red-2:#F46A4C; --pip-yellow:#FFC23A; --pip-blue:#1D6FE0; --pip-face:#FFF6EC; --pip-beak:#F2E3C8; --pip-ink:#1B1F2E; --pip-feet:#F2992B; --pip-cheek:#FF95A6;
  --box:#E8A23A; --box-edge:#9A5F12; --ball:#E8412C;
  --f-display:"Grandstander","Chalkboard SE","Comic Sans MS",system-ui,sans-serif;
  --f-body:"Andika","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  --f-emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1524; --surface:#18233A; --surface-2:#223150; --line:#2D3E60; --line-2:#3F5379;
  --fg:#EAF0FA; --muted:#9DABC6;
  --accent:#4C91FF; --accent-press:#2A63C4; --accent-soft:#1D3157; --on-accent:#FFFFFF;
  --sun:#FFC23A; --sun-press:#C98C00; --sun-soft:#3A2E12; --on-sun:#2E1E00;
  --ok:#3BBE63; --ok-press:#22863F; --ok-soft:#163525; --ok-ink:#86E8A2;
  --ko:#FF5C63; --ko-press:#B8323A; --ko-soft:#3D191C; --ko-ink:#FFA3A7;
  --c1:#3F86F5; --c2:#F0573F; --c3:#EFA21A; --c4:#1FB3A2; --c5:#9D69E6; --c6:#E25790; --c7:#62AE2C; --c8:#6B7EA6;
  --box:#D9952F; --box-edge:#F2C37A; --ball:#FF6A55;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1524; --surface:#18233A; --surface-2:#223150; --line:#2D3E60; --line-2:#3F5379;
  --fg:#EAF0FA; --muted:#9DABC6;
  --accent:#4C91FF; --accent-press:#2A63C4; --accent-soft:#1D3157; --on-accent:#FFFFFF;
  --sun:#FFC23A; --sun-press:#C98C00; --sun-soft:#3A2E12; --on-sun:#2E1E00;
  --ok:#3BBE63; --ok-press:#22863F; --ok-soft:#163525; --ok-ink:#86E8A2;
  --ko:#FF5C63; --ko-press:#B8323A; --ko-soft:#3D191C; --ko-ink:#FFA3A7;
  --c1:#3F86F5; --c2:#F0573F; --c3:#EFA21A; --c4:#1FB3A2; --c5:#9D69E6; --c6:#E25790; --c7:#62AE2C; --c8:#6B7EA6;
  --box:#D9952F; --box-edge:#F2C37A; --ball:#FF6A55;
  color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:400 17px/1.45 var(--f-body);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
.wrap{width:100%;max-width:560px;margin-inline:auto;padding-inline:16px}
.emo{font-family:var(--f-emoji);line-height:1}
.mut{color:var(--muted)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;padding:12px 18px;border-radius:16px;background:var(--accent);color:var(--on-accent);font:800 16px/1.1 var(--f-display);letter-spacing:.07em;text-transform:uppercase;box-shadow:0 5px 0 var(--accent-press);transition:transform .06s,box-shadow .06s;text-align:center}
.btn:active:not(:disabled){transform:translateY(5px);box-shadow:0 0 0 var(--accent-press)}
.btn:disabled{background:var(--surface-2);color:var(--muted);box-shadow:0 5px 0 var(--line);cursor:default}
.btn.ghost{background:var(--surface);color:var(--accent);box-shadow:0 0 0 2px var(--line) inset,0 4px 0 var(--line)}
.btn.ghost:active{box-shadow:0 0 0 2px var(--line) inset}
.btn.okb{background:var(--ok);box-shadow:0 5px 0 var(--ok-press)}
.btn.kob{background:var(--ko);box-shadow:0 5px 0 var(--ko-press)}
.btn.sunb{background:var(--sun);color:var(--on-sun);box-shadow:0 5px 0 var(--sun-press)}
.btn svg{width:20px;height:20px;flex:none}
.link{color:var(--accent);font:700 15px/1.2 var(--f-body);text-decoration:underline;text-underline-offset:3px;padding:6px 4px}

/* ---------- top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:2px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:8px;padding-block:8px}
.brand{display:flex;align-items:center;gap:6px;margin-right:auto;font:900 23px/1 var(--f-display);color:var(--fg)}
.brand .pip{width:38px;height:42px}
.chip{display:inline-flex;align-items:center;gap:4px;font:800 16px/1 var(--f-display);padding:6px 9px;border-radius:12px;font-variant-numeric:tabular-nums}
.chip svg{width:20px;height:20px}
.chip.fire{color:var(--c3)} .chip.fire.off{color:var(--muted)}
.chip.xp{color:var(--accent)}
.goal{width:38px;height:38px;position:relative;display:grid;place-items:center}
.goal svg{position:absolute;inset:0;transform:rotate(-90deg)}
.goal b{font:800 10px/1 var(--f-display);color:var(--muted);font-variant-numeric:tabular-nums}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted)}
.iconbtn svg{width:24px;height:24px}
.iconbtn:active{background:var(--surface-2)}

/* ---------- home ---------- */
.hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;margin-top:16px;padding:16px;background:var(--surface);border:2px solid var(--line);border-radius:22px}
.hero .pip{width:84px;height:92px}
.say{position:relative;background:var(--accent-soft);border-radius:16px;padding:10px 13px;font-size:16px;line-height:1.35}
.say::before{content:"";position:absolute;left:-8px;top:22px;border:8px solid transparent;border-left:0;border-right-color:var(--accent-soft)}
.say b{font-family:var(--f-display)}
.hero .btn{grid-column:1/-1}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:14px;border-radius:20px;background:var(--surface);border:2px solid var(--line);box-shadow:0 4px 0 var(--line);text-align:left;min-width:0;transition:transform .06s,box-shadow .06s}
.tile:active{transform:translateY(4px);box-shadow:0 0 0 var(--line)}
.tile .ti{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:24px;margin-bottom:4px}
.tile.rev .ti{background:var(--sun-soft)} .tile.test .ti{background:var(--accent-soft)}
.tile strong{font:800 17px/1.15 var(--f-display)}
.tile span{font-size:14px;color:var(--muted);line-height:1.3}

.path{display:flex;flex-direction:column;align-items:center;gap:22px;padding-block:28px 36px}
.sec{align-self:stretch;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:end;padding:14px 16px;border-radius:18px;background:var(--sc);color:#fff;box-shadow:0 5px 0 color-mix(in srgb,var(--sc) 62%,#000);margin-top:10px}
.sec .k{grid-column:1/-1;font:800 12px/1 var(--f-display);letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.sec h2{font-size:21px;line-height:1.15}
.sec .p{font:700 13px/1.2 var(--f-body);opacity:.92;white-space:nowrap;font-variant-numeric:tabular-nums}
.pnode.is-next{margin-top:28px}
.pnode{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;transform:translateX(var(--x,0));width:150px}
.ring{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--sun) calc(var(--p)*1%),var(--surface-2) 0);position:relative}
.ring::before{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--bg)}
.nbtn{position:relative;width:74px;height:70px;border-radius:50%;background:var(--uc);box-shadow:0 7px 0 color-mix(in srgb,var(--uc) 60%,#000);display:grid;place-items:center;font-size:34px;margin-top:-6px;transition:transform .06s,box-shadow .06s}
.nbtn:active{transform:translateY(6px);box-shadow:0 1px 0 color-mix(in srgb,var(--uc) 60%,#000)}
.nbtn.gold{background:var(--sun);box-shadow:0 7px 0 var(--sun-press)}
.nlabel{display:flex;flex-direction:column;align-items:center;text-align:center;line-height:1.2}
.nlabel b{font:800 16px/1.15 var(--f-display)}
.nlabel small{font-size:13px;color:var(--muted)}
.stars{font-size:15px;letter-spacing:2px;color:var(--line-2)}
.stars i{font-style:normal;color:var(--sun)}
.here{position:absolute;top:-30px;z-index:2;background:var(--surface);color:var(--uc);border:2px solid var(--line);font:900 13px/1 var(--f-display);letter-spacing:.08em;text-transform:uppercase;padding:7px 10px;border-radius:10px;white-space:nowrap;animation:bob 1.4s ease-in-out infinite}
.here::after{content:"";position:absolute;left:50%;bottom:-8px;width:12px;height:12px;background:var(--surface);border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateX(-50%) rotate(45deg)}
@keyframes bob{50%{transform:translateY(-5px)}}
.parents{margin:8px 0 40px;padding:14px 16px;background:var(--surface);border:2px solid var(--line);border-radius:18px;font-size:15px}
.parents summary{font:800 16px/1.2 var(--f-display);cursor:pointer;list-style:none}
.parents summary::-webkit-details-marker{display:none}
.parents summary::after{content:" +";color:var(--muted)}
.parents[open] summary::after{content:" –"}
.parents p{margin:10px 0 0;max-width:62ch}
.totals{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.totals span{background:var(--surface-2);border-radius:10px;padding:6px 10px;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}

/* ---------- pictures ---------- */
.pic{display:inline-grid;place-items:center;font-family:var(--f-emoji);line-height:1}
.pic.xl{font-size:92px;min-height:104px}
.pic.md{font-size:50px;min-height:58px}
.pic.sm{font-size:28px;width:40px;height:40px}
.pic.xs{font-size:22px;width:30px;height:30px}
.pic.lime{filter:hue-rotate(58deg) saturate(1.25) brightness(.95)}
.pic.num{font-family:var(--f-display);font-weight:900;color:var(--accent)}
.pic.xl.num{font-size:96px} .pic.md.num{font-size:52px} .pic.sm.num,.pic.xs.num{font-size:20px}
.pic.txt{font-family:var(--f-body);font-weight:700;color:var(--fg);background:var(--surface-2);text-align:center;max-width:100%}
.pic.sm.txt,.pic.xs.txt{font-size:0;background:var(--surface-2);border-radius:10px}
.pic.sm.txt::after,.pic.xs.txt::after{content:"?";font:800 16px/1 var(--f-display);color:var(--muted)}
.swatch{width:.95em;height:.95em;border-radius:50%;background:var(--sw);box-shadow:inset 0 -.08em 0 rgba(0,0,0,.18),0 0 0 2px var(--line)}
.pic svg.prep{width:1.5em;height:1.2em}
.prep .bx{fill:var(--box);stroke:var(--box-edge);stroke-width:2.5;stroke-linejoin:round}
.prep .bxin{fill:var(--box-edge);opacity:.55}
.prep .bl{fill:var(--ball);stroke:var(--fg);stroke-width:2}
.prep .gr{stroke:var(--line-2);stroke-width:3;stroke-linecap:round}
.prep .tb{fill:var(--box-edge)}

/* ---------- lesson ---------- */
.lesson{min-height:100%;display:flex;flex-direction:column}
.ltop{display:flex;align-items:center;gap:12px;padding-block:12px}
.bar{flex:1;height:16px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;min-width:16px;border-radius:99px;background:var(--ok);box-shadow:inset 0 5px 0 rgba(255,255,255,.28);transition:width .45s cubic-bezier(.3,1.4,.5,1)}
.combo{min-width:46px;display:flex;align-items:center;gap:2px;justify-content:flex-end;font:900 17px/1 var(--f-display);color:var(--c3);font-variant-numeric:tabular-nums}
.combo svg{width:20px;height:20px}
.qn{font:800 15px/1 var(--f-display);color:var(--muted);font-variant-numeric:tabular-nums;min-width:46px;text-align:right}
.lbody{flex:1;padding-bottom:210px}
.kind{font:800 13px/1 var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.kind.oral{color:var(--c6)} .kind.ecrit{color:var(--c5)} .kind.ecoute{color:var(--c4)} .kind.new{color:var(--c3)}
.prompt{font-size:clamp(23px,6vw,29px);line-height:1.15;margin:6px 0 18px}
.qcard{display:flex;flex-direction:column;align-items:center;gap:6px;margin:4px 0 18px}
.qfr{font:700 22px/1.2 var(--f-body);text-align:center}
.enq{font:700 clamp(34px,10vw,46px)/1.1 var(--f-body);letter-spacing:.01em}
.wordq{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;margin:6px 0 20px}
.audio{display:flex;justify-content:center;align-items:flex-end;gap:14px;margin:6px 0 22px}
.spk{width:96px;height:96px;border-radius:24px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;box-shadow:0 6px 0 var(--accent-press);transition:transform .06s,box-shadow .06s}
.spk:active{transform:translateY(6px);box-shadow:0 0 0 var(--accent-press)}
.spk svg{width:48px;height:48px}
.spk.slow{width:64px;height:64px;border-radius:18px;font-size:30px;background:var(--surface);box-shadow:0 0 0 2px var(--line) inset,0 5px 0 var(--line)}
.spk.mid{width:58px;height:58px;border-radius:16px;box-shadow:0 5px 0 var(--accent-press)}
.spk.mid svg{width:30px;height:30px}
.spk.sm{width:40px;height:40px;border-radius:12px;box-shadow:0 3px 0 var(--accent-press)}
.spk.sm svg{width:22px;height:22px}
.dfr{text-align:center;color:var(--muted);font-size:15px;margin:-10px 0 18px}

.opts{display:grid;gap:12px}
.grid2{grid-template-columns:1fr 1fr}
.opt{position:relative;display:flex;align-items:center;gap:12px;min-width:0;padding:14px;border-radius:18px;background:var(--surface);border:2px solid var(--line);box-shadow:0 4px 0 var(--line);text-align:left;transition:transform .06s,box-shadow .06s,background .15s,border-color .15s}
.opt:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.opt .k{position:absolute;top:8px;left:8px;width:22px;height:22px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;font:800 12px/1 var(--f-display);color:var(--muted)}
.opt.txt .k{position:static;flex:none;width:28px;height:28px}
.opt.picopt{flex-direction:column;justify-content:center;padding:16px 8px 12px;text-align:center}
.opt .lbl{font-size:15px;line-height:1.2;color:var(--muted);overflow-wrap:anywhere}
.opt .en{font:700 22px/1.2 var(--f-body);overflow-wrap:anywhere}
.opt.sel{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 4px 0 var(--accent)}
.opt.sel .k{border-color:var(--accent);color:var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-soft);box-shadow:0 4px 0 var(--ok)}
.opt.wrong{border-color:var(--ko);background:var(--ko-soft);box-shadow:0 4px 0 var(--ko)}
.opt:disabled{cursor:default}

.match{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mcol{display:grid;gap:10px;align-content:start}
.mitem{justify-content:center;min-height:68px;padding:10px}
.mitem .en{font-size:20px;text-align:center}
.mitem.picm{gap:8px;justify-content:flex-start}
.mitem.picm .lbl{text-align:left}
.mitem.done{opacity:.45;border-color:var(--ok);background:var(--ok-soft);box-shadow:0 2px 0 var(--ok);pointer-events:none}
.bad{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

.slots{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:10px 18px;margin:8px 0 26px}
.sgroup{display:flex;gap:5px;align-items:flex-end}
.slot{width:var(--sw,40px);height:50px;border-bottom:3px solid var(--line-2);display:grid;place-items:center;font:700 clamp(18px,calc(var(--sw,40px) * .72),28px)/1 var(--f-body);color:var(--fg)}
.slot.f{border-bottom-color:var(--accent);cursor:pointer}
.slot.nx{border-bottom-color:var(--accent);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{border-bottom-color:var(--line-2)}}
.slot.r{border-bottom-color:var(--ok);color:var(--ok-ink)}
.slot.w{border-bottom-color:var(--ko);color:var(--ko-ink)}
.sep{font:700 28px/50px var(--f-body);color:var(--muted)}
.bank{display:flex;flex-wrap:wrap;justify-content:center;gap:9px}
.tile-l{width:50px;height:56px;border-radius:14px;background:var(--surface);border:2px solid var(--line);box-shadow:0 4px 0 var(--line);font:700 26px/1 var(--f-body);transition:transform .06s,box-shadow .06s}
.tile-l:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.tile-l.used{background:var(--surface-2);border-color:var(--surface-2);box-shadow:none;color:transparent;pointer-events:none}

.answer{display:flex;flex-direction:column;align-items:center;gap:10px}
.answer input{width:100%;font:700 30px/1.2 var(--f-body);text-align:center;padding:14px 12px;border-radius:18px;border:2px solid var(--line);border-bottom-width:4px;background:var(--surface);color:var(--fg)}
.answer input:focus{border-color:var(--accent);outline:none}
.answer input.r{border-color:var(--ok);background:var(--ok-soft)}
.answer input.w{border-color:var(--ko);background:var(--ko-soft)}
.dashes{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;min-height:10px}
.dashes i{width:16px;height:4px;border-radius:2px;background:var(--line-2)}
.dashes b{width:14px}
.dashes s{text-decoration:none;color:var(--muted);font-weight:700;line-height:4px}

.micz{display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:8px}
.mic{width:112px;height:112px;border-radius:50%;background:var(--c6);color:#fff;display:grid;place-items:center;box-shadow:0 7px 0 color-mix(in srgb,var(--c6) 60%,#000);transition:transform .06s,box-shadow .06s;position:relative}
.mic svg{width:50px;height:50px}
.mic:active{transform:translateY(7px);box-shadow:0 0 0 transparent}
.mic.on::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:4px solid var(--c6);animation:pulse 1s ease-out infinite}
@keyframes pulse{from{opacity:1;transform:scale(.9)}to{opacity:0;transform:scale(1.25)}}
.micmsg{text-align:center;font-size:17px;max-width:32ch;min-height:2.6em}
.micmsg q{font-weight:700}
.reveal{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:6px}

.intro{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:22px 16px;border-radius:24px;background:var(--surface);border:2px solid var(--line)}
.intro .enq{font-size:clamp(40px,12vw,56px)}
.intro .alt{font-size:15px;color:var(--muted)}
.intro .row{display:flex;gap:12px;align-items:flex-end;margin-top:6px}
.tipline{display:flex;align-items:center;gap:10px;margin-top:16px;font-size:15px;color:var(--muted)}
.tipline .pip{width:40px;height:44px;flex:none}

.lfoot{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--bg);border-top:2px solid var(--line);padding:14px 0 calc(14px + env(safe-area-inset-bottom,0px));transition:background .2s}
.lfoot .wrap{display:flex;flex-direction:column;gap:12px}
.lfoot.ok{background:var(--ok-soft);border-top-color:transparent}
.lfoot.ko{background:var(--ko-soft);border-top-color:transparent}
.facts{display:flex;gap:12px}
.facts .btn.ghost{flex:0 1 auto;width:auto}
.fb{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:center;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(16px);opacity:0}}
.fb .badge{grid-row:span 3;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--surface)}
.fb .badge svg{width:30px;height:30px}
.lfoot.ok .badge{color:var(--ok)} .lfoot.ko .badge{color:var(--ko)}
.fb h3{font-size:24px;line-height:1.1}
.lfoot.ok .fb h3,.lfoot.ok .fb p{color:var(--ok-ink)}
.lfoot.ko .fb h3,.lfoot.ko .fb p{color:var(--ko-ink)}
.fb p{margin:0;font-size:16px;line-height:1.3}
.fb .ans{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font:700 22px/1.2 var(--f-body)}
.fb .ans .spk.sm{box-shadow:none}

/* results */
.result{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding-block:36px 40px}
.result .pip{width:150px;height:164px}
.result h1{font-size:clamp(32px,9vw,42px);line-height:1.05}
.result .sub{font-size:18px;color:var(--muted);margin:0}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%;margin:10px 0 8px}
.stat{border-radius:16px;border:2px solid var(--sc);overflow:hidden;background:var(--surface)}
.stat .h{background:var(--sc);color:#fff;font:800 11px/1 var(--f-display);letter-spacing:.1em;text-transform:uppercase;padding:7px 4px}
.stat .v{font:900 26px/1 var(--f-display);padding:12px 4px;font-variant-numeric:tabular-nums;color:var(--sc)}
.note{font:900 clamp(64px,22vw,96px)/1 var(--f-display);color:var(--accent);font-variant-numeric:tabular-nums}
.note small{font-size:.4em;color:var(--muted)}
.errs{width:100%;text-align:left;display:grid;gap:8px;margin:6px 0 10px;padding:0;list-style:none}
.errs li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;background:var(--surface);border:2px solid var(--line);border-radius:14px}
.errs .e1{font:700 19px/1.2 var(--f-body)}
.errs .e2{font-size:14px;color:var(--muted)}
.errs .e2 del{color:var(--ko-ink)}
.stack{display:grid;gap:14px;width:100%}

/* sheets */
#layer{position:fixed;inset:0;z-index:40}
.scrim{position:absolute;inset:0;background:rgba(8,14,28,.5);opacity:0;transition:opacity .2s}
#layer.open .scrim{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;margin-inline:auto;max-width:560px;max-height:88%;overflow:auto;overscroll-behavior:contain;background:var(--bg);border-radius:26px 26px 0 0;padding:10px 16px calc(24px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.9,.3,1)}
#layer.open .sheet{transform:none}
.sheet.center{top:50%;bottom:auto;left:16px;right:16px;border-radius:24px;transform:translateY(-40%);opacity:0;transition:transform .2s,opacity .2s;padding:22px 18px}
#layer.open .sheet.center{transform:translateY(-50%);opacity:1}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line-2);margin:0 auto 14px}
.uhead{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;margin-bottom:16px}
.uico{width:66px;height:66px;border-radius:50%;background:var(--uc);display:grid;place-items:center;font-size:32px;box-shadow:0 5px 0 color-mix(in srgb,var(--uc) 60%,#000)}
.kicker{font:800 12px/1 var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.uhead h3{font-size:25px;line-height:1.1;margin:4px 0 8px}
.meter{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--sun);border-radius:99px}
.uhead .mut{font-size:14px;margin-top:6px;font-variant-numeric:tabular-nums}
.row2{display:grid;grid-template-columns:1.3fr 1fr;gap:12px;margin-bottom:18px}
.wlist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.wlist li{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:6px 8px;border-radius:14px;background:var(--surface);border:2px solid transparent;transition:border-color .2s}
.wlist li.playing{border-color:var(--accent)}
.wl b{display:block;font:700 18px/1.2 var(--f-body);overflow-wrap:anywhere}
.wl b small{font-weight:400;color:var(--muted);font-size:14px}
.wl span{display:block;font-size:14px;color:var(--muted);line-height:1.2}
.str{display:flex;gap:3px}
.str i{width:7px;height:16px;border-radius:3px;background:var(--surface-2)}
.str.l1 i:nth-child(-n+1),.str.l2 i:nth-child(-n+2){background:var(--ko)}
.str.l3 i:nth-child(-n+3){background:var(--sun)}
.str.l4 i:nth-child(-n+4),.str.l5 i:nth-child(-n+5){background:var(--ok)}
.str.l0 i{background:var(--surface-2)}
.newtag{font:800 11px/1 var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.set{display:grid;gap:8px;padding:14px 0;border-bottom:2px solid var(--line)}
.set:last-child{border-bottom:0}
.set h4{margin:0;font:800 17px/1.2 var(--f-display)}
.set p{margin:0;font-size:14px;color:var(--muted)}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1 1 0;min-width:84px;padding:11px 10px;border-radius:12px;background:var(--surface);border:2px solid var(--line);font:700 15px/1.1 var(--f-body)}
.seg button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.danger{color:var(--ko-ink)}
.uchips{display:flex;flex-wrap:wrap;gap:8px}
.uchip{display:inline-flex;align-items:center;gap:6px;padding:8px 11px;border-radius:12px;background:var(--surface);border:2px solid var(--line);font:700 14px/1.1 var(--f-body)}
.uchip.on{border-color:var(--accent);background:var(--accent-soft)}
.uchip .emo{font-size:18px}
.page{padding-block:8px 40px}
.page h1{font-size:30px;margin:6px 0 6px}
.page .lead{margin:0 0 16px;color:var(--muted);max-width:60ch}
.grp{margin:16px 0 6px;font:800 13px/1 var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.hist{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.hist span{background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:5px 9px;font-size:14px;font-variant-numeric:tabular-nums}
.pagehead{display:flex;align-items:center;gap:8px;padding-block:10px}
.confirm h3{font-size:24px;margin-bottom:8px}
.confirm p{margin:0 0 18px;color:var(--muted)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}

@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (max-width:380px){.pic.xl{font-size:78px;min-height:88px}.spk{width:84px;height:84px}.tile-l{width:44px;height:52px}.quick{grid-template-columns:1fr}}

function norm(s){ return String(s).toLowerCase().replace(/[’‘`´]/g, "'").replace(/[.,!?;:"«»()]/g, ' ').replace(/-/g, ' ').replace(/\s+/g, ' ').trim().replace(/^(a|an|the|to) (?=\S)/, ''); }
const forms = w => [w.en, ...w.alts].map(norm);
function lev(a, b){ const m = a.length, n = b.length; if (!m) return n; if (!n) return m; let p = Array.from({length: n + 1}, (_, j) => j); for (let i = 1; i <= m; i++) { const c = [i]; for (let j = 1; j <= n; j++) c[j] = Math.min(p[j] + 1, c[j-1] + 1, p[j-1] + (a[i-1] === b[j-1] ? 0 : 1)); p = c; } return p[n]; }

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

const NUMW = ['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen','twenty'];
const HOMO = {two:['to','too'], four:['for'], eight:['ate'], one:['won'], pear:['pair','pare'], sea:['see','c'], hair:['hare'], tail:['tale'], eye:['i','aye'], red:['read'], write:['right','rite'], sun:['son'], flower:['flour'], meat:['meet'], bee:['be','b'], new:['knew'], no:['know'], hi:['high'], read:['red','reed'], bear:['bare'], ball:['bawl'], hall:['haul'], blue:['blew'], peas:['peace','piece'], nose:['knows'], whose:["who's",'whos'], plane:['plain'], mr:['mister'], mrs:['missus','misses'], tv:['television'], wave:['waive'], sweets:['suites'], night:['knight']};
function speechNorm(s){ return norm(s).split(' ').map(t => /^\d+$/.test(t) && +t <= 20 ? NUMW[+t] : t).join(' '); }
function speechMatch(w, heard){
  const targets = new Set();
  forms(w).forEach(f => { targets.add(f); (HOMO[f] || []).forEach(h => targets.add(h)); });
  if (w.sp) targets.add(norm(w.sp));
  for (const a of heard) {
    const h = speechNorm(a); if (!h) continue;
    for (const t of targets) {
      if (h === t || (' ' + h + ' ').includes(' ' + t + ' ')) return true;
      const tol = t.length <= 4 ? 0 : t.length <= 7 ? 1 : 2;
      if (lev(h, t) <= tol || lev(h.replace(/ /g, ''), t.replace(/ /g, '')) <= tol) return true;
    }
  }
  return false;
}
let REC = null;
function listen(done){
  let finished = false;
  const end = r => { if (finished) return; finished = true; REC = null; done(r); };
  try {
    const r = new SR(); REC = r;
    r.lang = S.accent; r.interimResults = false; r.maxAlternatives = 5; r.continuous = false;
    r.onresult = e => end({ok:true, alts: [...e.results[0]].map(a => a.transcript)});
    r.onerror = e => end({ok:false, err: e.error});
    r.onend = () => end({ok:false, err:'no-speech'});
    r.start();
  } catch (e) { end({ok:false, err:'start'}); }
}
function stopListen(){ if (REC) { try { REC.abort(); } catch (e) {} REC = null; } }

/* ---------- distractors ---------- */
function distract(w, n, pool){
  const f = new Set(forms(w));
  const bad = x => x === w || forms(x).some(y => f.has(y)) || x.fr === w.fr || (x.pic && x.pic === w.pic);
  let c = shuffle((pool || w.u.words).filter(x => !bad(x)));
  if (c.length < n) c = c.concat(shuffle(WORDS.filter(x => !bad(x) && !c.includes(x))));
  // pas deux fois le même mot anglais ni la même image parmi les options
  const out = [], seenEn = new Set(), seenPic = new Set();
  for (const x of c) { const k = norm(x.en); if (seenEn.has(k) || (x.pic && seenPic.has(x.pic))) continue; seenEn.add(k); if (x.pic) seenPic.add(x.pic); out.push(x); if (out.length === n) break; }
  return out;
}

/* ---------- building lessons ---------- */
function typeFor(b){
  const say = S.mic && !micOffSession;
  const sets = [
    ['listen', 'pick'],
    ['pick', 'listen', 'meaning', 'tiles'],
    ['tiles', 'listen', say ? 'say' : 'tiles', 'type'],
    ['type', 'tiles', 'dictee', say ? 'say' : 'dictee'],
    ['type', 'dictee', say ? 'say' : 'type'],
    ['type', 'dictee', say ? 'say' : 'type']
  ];
  return any(sets[Math.min(b, 5)]);
}
function buildUnit(u){
  const unseen = u.words.filter(w => !rec(w));
  const seen = u.words.filter(w => rec(w)).sort((a, b) => (box(a) - box(b)) || (rec(a).t - rec(b).t));
  const nNew = Math.min(unseen.length, seen.length < 3 ? 4 : 3);
  const news = unseen.slice(0, nNew);
  const revN = Math.min(seen.length, Math.max(4, 9 - nNew * 2));
  const revs = shuffle(seen.slice(0, revN + 3)).slice(0, revN);
  const A = news.map(w => [{type:'intro', w}, {type: Math.random() < .5 ? 'listen' : 'pick', w}]);
  const B = revs.map(w => ({type: typeFor(box(w)), w}));
  const out = [];
  while (A.length || B.length) { if (A.length) out.push(...A.shift()); if (B.length) out.push(B.shift()); }
  const C = news.map(w => ({type: Math.random() < .5 ? 'meaning' : 'tiles', w}));
  if (!news.length) seen.slice(0, 3).forEach(w => C.push({type: typeFor(Math.max(2, box(w))), w}));
  const known = [...news, ...revs];
  if (known.length >= 4) C.push({type:'match', ws: pickN(known, Math.min(5, known.length))});
  out.push(...shuffle(C));
  return out;
}
function buildReview(){
  const seen = WORDS.filter(w => rec(w));
  if (seen.length < 4) return null;
  seen.sort((a, b) => (box(a) - box(b)) || (rec(a).t - rec(b).t));
  const ws = shuffle(seen.slice(0, 16)).slice(0, 10);
  const q = ws.map(w => ({type: typeFor(Math.max(2, box(w))), w}));
  q.splice(Math.min(5, q.length), 0, {type:'match', ws: pickN(ws, Math.min(5, ws.length))});
  return q;
}
function buildTest(unitIds, len){
  const pool = shuffle(UNITS.filter(u => unitIds.includes(u.id)).flatMap(u => u.words));
  const ws = pool.slice(0, Math.min(len, pool.length));
  const say = S.mic && !micOffSession;
  const pattern = ['type', 'listen', 'type', say ? 'say' : 'dictee', 'dictee', 'type', 'listen', say ? 'say' : 'type', 'type', 'dictee'];
  return shuffle(ws.map((w, i) => ({type: pattern[i % pattern.length], w})));
}

    return {
      prompt: 'Écris le mot avec les lettres',
      body: `${qcard(w)}<div style="display:flex;justify-content:center;margin:-6px 0 4px">${spkBtn(w, 'sm')}</div>
        <div class="slots" id="slots" style="--sw:min(40px, calc((100vw - 40px) / ${longest} - 5px))"></div>
        <div class="bank" id="bank">${bank.map((c, i) => `<button class="tile-l" data-i="${i}">${esc(c)}</button>`).join('')}</div>`,
      mount(){
        draw();
        $('#bank').onclick = e => { const b = e.target.closest('.tile-l'); if (!b || cur.state !== 'ask') return; if (ans.length < letters.length) { ans.push(+b.dataset.i); draw(); } };
        $('#slots').onclick = e => { const s = e.target.closest('.slot.f'); if (!s || cur.state !== 'ask') return; ans.splice(+s.dataset.k, 1); draw(); };
      },
      check(){
        const given = ans.map(i => bank[i]).join('');
        return {ok: given.toLowerCase() === letters.join('').toLowerCase(), given: ''};
      },
      after(){ $$('#slots .slot').forEach(s => { const k = +s.dataset.k; s.classList.remove('nx'); s.classList.add(bank[ans[k]] && bank[ans[k]].toLowerCase() === letters[k].toLowerCase() ? 'r' : 'w'); }); $$('#bank .tile-l').forEach(b => b.disabled = true); }
    };
  },
  type(it){ return inputEx(it.w, 'Écris en anglais', qcard(it.w), {}); },
  dictee(it){
    const w = it.w;
    return inputEx(w, 'Écoute et écris le mot', `<div class="audio">${spkBtn(w)}${slowBtn(w)}</div>${L.mode === 'test' ? '' : `<p class="dfr">indice : ${esc(w.fr)}</p>`}`, {speak: true});
  },
  say(it){
    const w = it.w, repeat = box(w) <= 2 && L.mode !== 'test';
    let tries = 0, self = !canListen();
    const msgSelf = 'Dis le mot à voix haute, puis touche « Vérifier ».';
    const showSelfButtons = heard => {
      $('#micmsg').innerHTML = (heard ? `J'ai entendu <q>${esc(heard)}</q>. ` : '') + `La réponse est <b>${esc(w.en)}</b>. Tu l'as bien dit ?`;
      sayW(w);
      $('#facts').innerHTML = `<button class="btn ghost" id="selfno">Pas tout à fait</button><button class="btn okb" id="selfyes">Oui, je l'ai dit</button>`;
      $('#selfyes').onclick = () => resolve({ok: true, assisted: !!heard});
      $('#selfno').onclick = () => resolve({ok: false, given: heard || ''});
    };
    return {
      prompt: repeat ? 'Répète à voix haute' : 'Dis-le en anglais',
      body: (repeat ? `<div class="wordq">${spkBtn(w, 'mid')}<span class="enq">${esc(w.en)}</span></div><p class="dfr" style="margin-top:-12px">${esc(w.fr)}</p>` : qcard(w)) +
        `<div class="micz">${self ? '' : `<button class="mic" id="mic" aria-label="Parler">${ICON.mic}</button>`}<div class="micmsg" id="micmsg">${self ? msgSelf : 'Touche le micro et dis le mot.'}</div></div>`,
      foot: self ? null : `<button class="btn ghost" id="nomic">Je ne peux pas parler</button>`,
      mount(){
        if (repeat) sayW(w);
        if (self) { setReady(true); return; }
        $('#nomic').onclick = () => { micOffSession = true; L.q[L.i] = {type: 'type', w}; render(L.q[L.i]); };
        const mic = $('#mic'), msg = $('#micmsg');
        mic.onclick = () => {
          if (cur.state !== 'ask') return;
          if (REC) { stopListen(); return; }
          try { speechSynthesis.cancel(); } catch (e) {}
          mic.classList.add('on'); msg.textContent = "Je t'écoute…";
          listen(res => {
            if (!cur || cur.it !== it || cur.state !== 'ask') return;
            mic.classList.remove('on');
            if (res.ok) {
              if (speechMatch(w, res.alts)) return resolve({ok: true, given: res.alts[0]});
              tries++;
              if (tries >= 2) return showSelfButtons(res.alts[0]);
              msg.innerHTML = `J'ai entendu <q>${esc(res.alts[0])}</q>. Réessaie !`;
            } else if (['not-allowed', 'service-not-allowed', 'audio-capture', 'network', 'start', 'language-not-supported'].includes(res.err)) {
              srBroken = true; self = true; mic.remove();
              msg.textContent = "Le micro n'est pas disponible. " + msgSelf;
              $('#facts').innerHTML = `<button class="btn" id="check">${L.mode === 'test' ? 'Valider' : 'Vérifier'}</button>`; bindCheck(); setReady(true);
            } else {
              msg.textContent = "Je n'ai rien entendu. Touche le micro et parle bien fort.";
            }
          });
        };
      },
      check(){ if (self) { showSelfButtons(''); return {pending: true}; } return null; }
    };
  },
  match(it){
    const ws = it.ws, left = shuffle(ws), right = shuffle(ws);
    let sl = null, sr = null, done = 0;
    const missed = new Set();
    return {
      prompt: 'Relie chaque mot à son image',
      body: `<div class="match"><div class="mcol">${left.map(w => `<button class="opt mitem" data-side="l" data-id="${esc(w.id)}"><span class="en">${esc(w.en)}</span></button>`).join('')}</div>
        <div class="mcol">${right.map(w => `<button class="opt mitem picm" data-side="r" data-id="${esc(w.id)}">${w.pic ? pic(w, 'xs') : ''}<span class="lbl">${esc(w.fr)}</span></button>`).join('')}</div></div>`,
      foot: '<p class="mut" style="margin:6px auto;text-align:center">Touche un mot anglais, puis sa traduction.</p>',
      mount(){
        $$('.mitem').forEach(b => b.onclick = () => {
          if (cur.state !== 'ask') return;
          const side = b.dataset.side;
          $$(`.mitem[data-side="${side}"]`).forEach(x => x.classList.remove('sel'));
          b.classList.add('sel');
          if (side === 'l') { sl = b; sayW(BYID[b.dataset.id]); } else sr = b;
          if (sl && sr) {
            const a = sl, c = sr; sl = sr = null;
            if (a.dataset.id === c.dataset.id) {
              [a, c].forEach(x => { x.classList.remove('sel'); x.classList.add('done'); }); done++; sfx('ok');
              if (done === ws.length) {
                ws.forEach(w => grade(w, 'match', !missed.has(w.id)));
                setTimeout(() => resolve({ok: missed.size === 0}), 300);
              }
            } else {
              missed.add(a.dataset.id); missed.add(c.dataset.id); sfx('ko');
              [a, c].forEach(x => { x.classList.remove('sel'); x.classList.add('bad', 'wrong'); });
              setTimeout(() => [a, c].forEach(x => x.classList.remove('bad', 'wrong')), 450);
            }
          }
        });
      }
    };
  }
};
function bindLater(opts, w, speakOnTap){ const o = {h: null}; o.bind = () => { o.h = bindOpts(opts, w, speakOnTap); }; return o; }

/* ---------- end of lesson ---------- */
function finish(){
  if (L.mode === 'test') return testResult();
  const tot = L.ok + L.ko, acc = Math.round(100 * L.ok / Math.max(1, tot));
  const xp = L.ok + 5 + (L.ko === 0 ? 5 : 0);
  addXp(xp); S.lessons++; const newDay = bumpStreak(); save();
  const secs = Math.round((Date.now() - L.t0) / 1000), mins = Math.floor(secs / 60);
  const u = L.u, title = L.ko === 0 ? 'Perfect!' : acc >= 80 ? 'Well done!' : 'Good job!';
  app.innerHTML = `<main class="wrap result">${pipSVG('wink')}
    <h1>${title}</h1><p class="sub">${L.mode === 'review' ? 'Révision terminée' : 'Leçon terminée'}${newDay ? ` · ${S.streak} jour${S.streak > 1 ? 's' : ''} d'affilée` : ''}</p>
    <div class="stats">
      <div class="stat" style="--sc:var(--sun-press)"><div class="h">XP gagnés</div><div class="v">+${xp}</div></div>
      <div class="stat" style="--sc:var(--ok)"><div class="h">Réussite</div><div class="v">${acc} %</div></div>
      <div class="stat" style="--sc:var(--accent)"><div class="h">Temps</div><div class="v">${mins}:${String(secs % 60).padStart(2, '0')}</div></div>
    </div>
    ${u ? `<p class="sub">${esc(u.t)} : ${learnedN(u.words)} / ${u.words.length} mots appris</p>` : ''}
    <div class="stack">${u ? `<button class="btn" data-act="learn" data-u="${u.id}">Encore une leçon</button>` : `<button class="btn" data-act="review">Encore une révision</button>`}
      <button class="btn ghost" data-act="home">Retour au parcours</button></div></main>`;
  L = null; cur = null;
  sfx('done'); confetti(); window.scrollTo(0, 0);
}

/* ---------- mock test ---------- */
let testSel = null;
function testSetup(){
  closeSheet(true); stopFx();
  if (!testSel) testSel = new Set(S.testUnits || UNITS.filter(u => u.s !== 8).map(u => u.id));
  const hist = S.tests.slice(-8);
  app.innerHTML = `<main class="wrap page">
    <div class="pagehead"><button class="iconbtn" data-act="home" aria-label="Retour">${ICON.back}</button></div>
    <h1>Interro blanche</h1>
    <p class="lead">Des questions sans indice, comme en classe : écrire le mot, l'écrire sous la dictée, le reconnaître à l'oreille et le dire. La note sur 20 et la correction arrivent à la fin.</p>
    ${hist.length ? `<div class="grp">Tes dernières notes</div><div class="hist">${hist.map(t => `<span>${t.d.slice(8, 10)}/${t.d.slice(5, 7)} · <b>${t.n}/20</b></span>`).join('')}</div>` : ''}
    <div class="grp">Nombre de questions</div>
    <div class="seg">${[10, 20, 30].map(n => `<button class="${S.testLen === n ? 'on' : ''}" data-act="tlen" data-v="${n}">${n} questions</button>`).join('')}</div>
    <div class="grp" style="display:flex;justify-content:space-between;align-items:center">Thèmes de l'interro <span><button class="link" data-act="tall">Tout</button> <button class="link" data-act="tnone">Aucun</button></span></div>
    ${SECTIONS.map(s => `<p class="mut" style="margin:12px 0 6px;font-size:14px">${esc(s.t)}</p><div class="uchips">${UNITS.filter(u => u.s === s.id).map(u => `<button class="uchip ${testSel.has(u.id) ? 'on' : ''}" data-act="tunit" data-u="${u.id}" aria-pressed="${testSel.has(u.id)}"><span class="emo">${u.ico}</span>${esc(u.t)}</button>`).join('')}</div>`).join('')}
    <div style="margin-top:26px"><button class="btn sunb" data-act="teststart" ${testSel.size ? '' : 'disabled'}>Commencer l'interro</button></div>
  </main>`;
}
function testResult(){
  const n = L.q.length, note = Math.round(40 * L.ok / n) / 2;
  S.tests.push({d: today(), n: note, len: n}); if (S.tests.length > 30) S.tests.shift();
  addXp(L.ok); bumpStreak(); save();
  const errs = L.log.filter(x => !x.ok);
  const msg = note >= 18 ? 'Excellent !' : note >= 15 ? 'Très bien !' : note >= 12 ? 'Bien joué !' : note >= 10 ? 'Pas mal, continue !' : "Il faut encore s'entraîner";
  const label = {type: 'écrit', dictee: 'dictée', listen: 'écoute', say: 'oral'};
  app.innerHTML = `<main class="wrap result">
    <div class="note">${String(note).replace('.', ',')}<small>/20</small></div>
    <h1>${msg}</h1><p class="sub">${L.ok} bonne${L.ok > 1 ? 's' : ''} réponse${L.ok > 1 ? 's' : ''} sur ${n}</p>
    ${errs.length ? `<div class="grp" style="align-self:flex-start">À corriger</div><ul class="errs">${errs.map(e => `<li>${pic(e.w, 'sm')}<div><div class="e1">${esc(e.w.en)}</div><div class="e2">${esc(e.w.fr)} · ${label[e.type]}${e.given ? ` · <del>${esc(e.given)}</del>` : ''}</div></div>${spkBtn(e.w, 'sm')}</li>`).join('')}</ul>` : '<p class="sub">Aucune erreur. Bravo !</p>'}
    <div class="stack">${errs.length ? `<button class="btn" data-act="fixerrs">Réviser mes erreurs</button>` : ''}
      <button class="btn ghost" data-act="testsetup">Nouvelle interro</button><button class="btn ghost" data-act="home">Retour au parcours</button></div></main>`;
  const errWords = errs.map(e => e.w);
  L = null; cur = null; lastErrs = errWords;
  if (note >= 15) { sfx('done'); confetti(); }
  window.scrollTo(0, 0);
}
let lastErrs = [];

/* ---------- confetti ---------- */
let fxTok = 0;
function stopFx(){ fxTok++; const c = $('#fx'); c.hidden = true; }
function confetti(){
  if (reduced()) return;
  const tok = ++fxTok;
  const c = $('#fx'), ctx = c.getContext('2d'), dpr = window.devicePixelRatio || 1, W = innerWidth, H = innerHeight;
  c.width = W * dpr; c.height = H * dpr; ctx.scale(dpr, dpr); c.hidden = false;
  const cs = getComputedStyle(document.documentElement);
  const cols = ['--c1', '--c2', '--c3', '--c4', '--c5', '--sun', '--ok'].map(v => cs.getPropertyValue(v).trim());
  const P = Array.from({length: 150}, () => ({x: W / 2 + (Math.random() - .5) * 120, y: H * .32, vx: (Math.random() - .5) * 14, vy: -Math.random() * 13 - 4, r: Math.random() * 7 + 5, a: Math.random() * 6, va: (Math.random() - .5) * .35, c: any(cols)}));
  let t = 0;
  (function f(){
    ctx.clearRect(0, 0, W, H);
    P.forEach(p => { p.vy += .32; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.a += p.va; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); ctx.restore(); });
    if (tok !== fxTok) { ctx.clearRect(0, 0, W, H); return; }
    if (++t < 170) requestAnimationFrame(f); else { ctx.clearRect(0, 0, W, H); c.hidden = true; }
  })();
}

/* =========================================================
   ACTIONS
   ========================================================= */
const ACT = {
  home: () => { closeSheet(true); home(); },
  unit: t => openUnit(t.dataset.u),
  learn: t => { const u = U[t.dataset.u]; runLesson({mode: 'unit', u, q: buildUnit(u)}); },
  review: () => { const q = buildReview(); if (!q) { openSheet(`<div class="confirm"><h3>Pas encore de mots à revoir</h3><p>Fais d'abord une leçon : Coco te fera réviser les mots ensuite.</p><button class="btn" data-act="closesheet">D'accord</button></div>`, 'center'); return; } runLesson({mode: 'review', q}); },
  testsetup: () => testSetup(),
  tunit: t => { const id = t.dataset.u; testSel.has(id) ? testSel.delete(id) : testSel.add(id); S.testUnits = [...testSel]; save(); testSetup(); },
  tall: () => { testSel = new Set(UNITS.map(u => u.id)); S.testUnits = [...testSel]; save(); testSetup(); },
  tnone: () => { testSel = new Set(); S.testUnits = []; save(); testSetup(); },
  tlen: t => { S.testLen = +t.dataset.v; save(); testSetup(); },
  teststart: () => { if (!testSel.size) return; runLesson({mode: 'test', q: buildTest([...testSel], S.testLen)}); },
  fixerrs: () => { const ws = lastErrs; if (!ws.length) return home(); const q = []; ws.forEach(w => q.push({type: 'tiles', w})); shuffle(ws).forEach(w => q.push({type: 'type', w})); runLesson({mode: 'review', q}); },
  settings: () => openSettings(false),
  set: t => { const k = t.dataset.k, v = t.dataset.v; S[k] = v === 'true' ? true : v === 'false' ? false : isNaN(+v) ? v : +v; save(); if (k === 'accent') pickVoice(); openSettingsKeep(); if (k === 'goal' || k === 'mic') refreshTop(); },
  testvoice: () => speak('Hello! I am Coco. Let\'s learn English!'),
  reset: () => openSettingsKeep(true),
  resetyes: () => { S = JSON.parse(JSON.stringify(DEF)); save(); testSel = null; closeSheet(true); home(); },
  say: t => { const w = BYID[t.dataset.w]; if (w) sayW(w, t.dataset.slow === '1'); },
  playall: t => playAll(U[t.dataset.u].words),
  closesheet: () => closeSheet()
};
function openSettingsKeep(confirmReset){ const sc = $('.sheet', layer); const y = sc ? sc.scrollTop : 0; layer.innerHTML = ''; layer.classList.add('open'); openSettings(confirmReset); const s2 = $('.sheet', layer); if (s2) { layer.classList.add('open'); s2.scrollTop = y; } }
function refreshTop(){ if (!L && $('.top')) { const t = $('.top'); t.outerHTML = topBar(); } }

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const f = ACT[t.dataset.act]; if (!f) return;
  e.preventDefault(); ac(); f(t, e);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !layer.hidden) { closeSheet(); return; }
  if (!L || !cur || !layer.hidden) return;
  const inInput = document.activeElement && document.activeElement.tagName === 'INPUT';
  if (e.key === 'Enter' && !inInput) { const c = $('#check'); if (c && !c.disabled) { e.preventDefault(); c.click(); } }
  else if (/^[1-4]$/.test(e.key) && !inInput && cur.state === 'ask') { const o = app.querySelector(`.opts .opt[data-i="${+e.key - 1}"]`); if (o) o.click(); }
});
document.addEventListener('visibilitychange', () => { if (document.hidden) { stopListen(); if (TTS) try { speechSynthesis.cancel(); } catch (e) {} } });

home();
</script>
